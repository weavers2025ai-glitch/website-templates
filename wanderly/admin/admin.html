<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Wanderly Travels</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c1:#0E7C61;--dark:#14161A;--acc:#FFB03A;--bg:#F4F4F2;--line:#E7E4DC;--mut:#7A746A;--grn:#1E9E57;--amb:#E8930C;--red:#D7263D}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:#1C1A17;font-size:14.5px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
label{font-size:12.5px;font-weight:700;display:block;margin-bottom:5px;color:#3D382F}
.btn{background:var(--c1);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:#fff;color:#1C1A17;border:1.5px solid var(--line)}
.btn.danger{background:#FDECEC;color:var(--red);border:1px solid #F5C6CB}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
/* login */
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}
#login .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;width:100%;max-width:380px;text-align:center}
#login .mark{width:58px;height:58px;border-radius:16px;background:var(--c1);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin:0 auto 14px}
#login h1{font-size:21px;margin-bottom:4px}
#login p{color:var(--mut);font-size:13.5px;margin-bottom:20px}
#login .err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
/* layout */
#app{display:none;min-height:100dvh}
.side{position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--dark);color:#CFCBC2;display:flex;flex-direction:column;z-index:50}
.side .brand{display:flex;gap:10px;align-items:center;padding:18px;color:#fff;font-weight:800;font-size:16.5px;border-bottom:1px solid rgba(255,255,255,.09)}
.side .brand .mark{width:36px;height:36px;border-radius:10px;background:var(--c1);display:grid;place-items:center;font-size:15px}
.side nav{flex:1;overflow:auto;padding:12px 10px}
.side nav button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:none;color:#CFCBC2;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:500;text-align:left;margin-bottom:2px}
.side nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.side nav button.on{background:var(--c1);color:#fff}
.side .foot{padding:12px;border-top:1px solid rgba(255,255,255,.09);display:flex;gap:8px}
.side .foot a,.side .foot button{flex:1;text-align:center;background:rgba(255,255,255,.07);color:#fff;border:none;padding:9px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none}
.main{margin-left:232px;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:24px;letter-spacing:-.01em}
.topbar .sub{color:var(--mut);font-size:13.5px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.stat .l{color:var(--mut);font-size:13px;font-weight:600}
.stat .n{font-size:27px;font-weight:800;margin:5px 0 2px}
.stat .d{font-size:12.5px;font-weight:700}
.up{color:var(--grn)}.down{color:var(--red)}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:20px}
.panel h3{font-size:16.5px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:9px 10px;border-bottom:1.5px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #F0EDE4;vertical-align:middle}
tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:4px 11px;border-radius:30px;font-size:12px;font-weight:700}
.pill.g{background:#E7F7EE;color:var(--grn)}.pill.a{background:#FDF3E2;color:var(--amb)}.pill.r{background:#FDECEC;color:var(--red)}.pill.b{background:#EAF1FC;color:#1459C8}.pill.n{background:#F0EDE4;color:var(--mut)}
.timg{width:44px;height:44px;border-radius:10px;object-fit:cover}
.rowb{display:flex;gap:8px;flex-wrap:wrap}
.searchbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.searchbar input{max-width:320px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.field{margin-bottom:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.bar .col{width:100%;max-width:52px;background:var(--c1);border-radius:8px 8px 0 0;min-height:4px}
.bar span{font-size:11.5px;color:var(--mut);text-align:center}
.bar b{font-size:12px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mgrid figure{border:1px solid var(--line);border-radius:13px;overflow:hidden}
.mgrid img{width:100%;aspect-ratio:1/.72;object-fit:cover}
.mgrid figcaption{padding:9px 11px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.modal{position:fixed;inset:0;background:rgba(15,12,8,.5);display:none;place-items:center;z-index:100;padding:16px}
.modal.on{display:grid}
.modal .box{background:#fff;border-radius:18px;max-width:620px;width:100%;max-height:92dvh;overflow:auto;padding:26px;position:relative}
.modal .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:#F4F1EA;font-size:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#14161A;color:#fff;padding:12px 22px;border-radius:40px;font-weight:600;font-size:14px;z-index:300;transition:.3s}
.toast.on{transform:translateX(-50%) translateY(0)}
.note{background:#FDF6E3;border:1px solid #F0DFA8;border-radius:12px;padding:12px 15px;font-size:13.5px;margin-bottom:16px}
@media(max-width:1020px){.cards{grid-template-columns:repeat(2,1fr)}.mgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){.side{width:64px}.side .brand span,.side nav button span,.side .foot{display:none}.side nav button{justify-content:center}.main{margin-left:64px;padding:18px 14px 50px}.grid2,.frow{grid-template-columns:1fr}.mgrid{grid-template-columns:repeat(2,1fr)}table{font-size:13px}}
</style>
</head>
<body>
<div id="login"><div class="card"><div class="mark">WT</div>
<h1>Wanderly Travels — Admin</h1><p>Enter your panel password to continue.</p>
<form onsubmit="return doLogin(event)"><input type="password" id="pw" placeholder="Password" autocomplete="current-password">
<div class="err" id="loginErr"></div><button class="btn" style="width:100%;margin-top:8px">Login to Panel</button></form>
<p style="margin-top:16px"><a href="../index.html" style="color:var(--c1);font-weight:600">← Back to Website</a></p></div></div>
<div id="app">
<aside class="side"><div class="brand"><span class="mark" id="sideMark">WT</span><span id="sideBrand">Wanderly Travels</span></div>
<nav id="nav"></nav>
<div class="foot"><a href="../index.html">View Site</a><button onclick="logout()">Logout</button></div></aside>
<main class="main"><div class="topbar"><div><h1 id="modTitle">Dashboard</h1><div class="sub">Demo admin panel — changes save in this browser and reflect on the website instantly.</div></div>
<button class="btn ghost" onclick="go('products')">+ Add Product</button></div>
<div id="content"></div></main></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

  POSTS = store.get('posts', []); SHIPPING = store.get('shipping', []); USERS = store.get('users', []);
}

function saveProduct(ev, id) {
  ev.preventDefault(); const f = ev.target;
  const data = { name: f.name.value, cat: f.cat.value, price: Number(f.price.value), stock: Number(f.stock.value), note: f.note.value, blurb: f.blurb.value, img: f.img.value };
  if (id) { const it = ITEMS.find(x => x.id === id); Object.assign(it, data); }
  else { data.id = ITEMS.length ? Math.max.apply(null, ITEMS.map(i => i.id)) + 1 : 1; ITEMS.push(data); }
  saveItems(); closeBox(); go('products'); toast('Product saved — live on your website'); return false;
}
function delProduct(id) { if (!confirm('Delete this product?')) return; ITEMS = ITEMS.filter(i => i.id !== id); saveItems(); go('products'); toast('Product deleted'); }
/* ---------- orders ---------- */
function modOrders() {
  $('#content').innerHTML = `<div class="panel"><table><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr>
  ${ORDERS.map((o, ix) => `<tr><td><b>${esc(o.id)}</b><br><span class="pill ${o.type === 'Enquiry' ? 'b' : 'n'}">${esc(o.type || 'Order')}</span></td><td>${dstr(o.date)}</td><td>${esc(o.name)}<br><span style="color:var(--mut);font-size:12.5px">${esc(o.phone)}</span></td><td>${o.items ? o.items.reduce((s, x) => s + x.qty, 0) : 0}</td><td><b>${fmt(o.total)}</b></td><td>${esc(o.payment || '—')}</td>
  <td><select onchange="setOrderStatus(${ix},this.value)" style="width:auto;padding:7px 9px">${['New', 'Pending', 'Processing', 'Completed', 'Delivered', 'Cancelled'].map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
  <td><button class="btn sm ghost" onclick="orderView(${ix})">View</button></td></tr>`).join('') || '<tr><td colspan="8">No orders yet — orders placed on the website appear here.</td></tr>'}
  </table></div>`;
}
function setOrderStatus(ix, st) { ORDERS[ix].status = st; store.set('orders', ORDERS); toast('Order ' + ORDERS[ix].id + ' → ' + st); }
function orderView(ix) {
  const o = ORDERS[ix];
  openBox(`<h3 style="margin-bottom:4px">${esc(o.id)} — ${esc(o.type || 'Order')}</h3>
  <p style="color:var(--mut);margin-bottom:14px">${dstr(o.date)} · Status: ${esc(o.status)}</p>
  <p><b>${esc(o.name)}</b><br>${esc(o.phone)}<br>${esc(o.address || '')}</p>
  ${o.note ? `<p style="margin-top:8px"><b>Note:</b> ${esc(o.note)}</p>` : ''}
  <table style="margin-top:14px"><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>
  ${(o.items || []).map(x => `<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${fmt(x.price)}</td><td><b>${fmt(x.price * x.qty)}</b></td></tr>`).join('')}
  <tr><td colspan="3"><b>Grand Total</b></td><td><b>${fmt(o.total)}</b></td></tr></table>
  <p style="margin-top:12px">Payment: <b>${esc(o.payment || '—')}</b></p>
  <a class="btn" style="margin-top:14px;display:inline-block" target="_blank" href="https://wa.me/${esc(String(o.phone).replace(/[^0-9]/g, ''))}">Message Customer on WhatsApp</a>`);
}
/* ---------- customers ---------- */
function modCustomers() {
  $('#content').innerHTML = `<div class="searchbar"><button class="btn" onclick="customerForm()">+ Add Customer</button></div>
  <div class="panel"><table><tr><th>Customer</th><th>Phone</th><th>Email</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th></th></tr>
  ${CUSTOMERS.map((c, ix) => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${c.orders}</td><td><b>${fmt(c.spent)}</b></td><td>${dstr(c.joined)}</td>
  <td><button class="btn sm danger" onclick="delCustomer(${ix})">Delete</button></td></tr>`).join('') || '<tr><td colspan="7">No customers yet.</td></tr>'}</table></div>`;
}
function customerForm() {
  openBox(`<h3 style="margin-bottom:16px">Add Customer</h3><form onsubmit="return saveCustomer(event)">
  <div class="field"><label>Name</label><input name="name" required></div>
  <div class="frow"><div class="field"><label>Phone</label><input name="phone" required></div>
  <div class="field"><label>Email</label><input name="email" type="email"></div></div>
  <button class="btn" style="width:100%">Save Customer</button></form>`);
}
function saveCustomer(ev) { ev.preventDefault(); const f = ev.target; CUSTOMERS.unshift({ name: f.name.value, phone: f.phone.value, email: f.email.value, orders: 0, spent: 0, joined: new Date().toISOString() }); store.set('customers', CUSTOMERS); closeBox(); go('customers'); toast('Customer added'); return false; }
function delCustomer(ix) { if (!confirm('Delete this customer?')) return; CUSTOMERS.splice(ix, 1); store.set('customers', CUSTOMERS); go('customers'); }
/* ---------- categories ---------- */
function modCategories() {
  $('#content').innerHTML = `<div class="searchbar"><input id="newCat" placeholder="New category name…"><button class="btn" onclick="addCat()">+ Add Category</button></div>
  <div class="panel"><table><tr><th>Category</th><th>Items</th><th></th></tr>
  ${CATS.map((c, ix) => `<tr><td><b>${esc(c)}</b></td><td>${ITEMS.filter(i => i.cat === c).length}</td>
  <td><div class="rowb"><button class="btn sm ghost" onclick="renameCat(${ix})">Rename</button><button class="btn sm danger" onclick="delCat(${ix})">Delete</button></div></td></tr>`).join('')}</table>
  <p style="color:var(--mut);margin-top:10px;font-size:13px">Deleting a category moves its items to “General”.</p></div>`;
}
function addCat() { const v = $('#newCat').value.trim(); if (!v) return; if (!CATS.includes(v)) CATS.push(v); saveItems(); go('categories'); toast('Category added'); }
function renameCat(ix) { const v = prompt('New name for “' + CATS[ix] + '”:', CATS[ix]); if (!v) return; ITEMS.forEach(i => { if (i.cat === CATS[ix]) i.cat = v; }); CATS[ix] = v; saveItems(); go('categories'); }
function delCat(ix) { if (!confirm('Delete category “' + CATS[ix] + '”?')) return; ITEMS.forEach(i => { if (i.cat === CATS[ix]) i.cat = 'General'; }); if (!CATS.includes('General')) CATS.push('General'); CATS.splice(ix, 1); saveItems(); go('categories'); }
/* ---------- coupons ---------- */
function modCoupons() {
  $('#content').innerHTML = `<div class="searchbar"><button class="btn" onclick="couponForm()">+ Add Coupon</button></div>
  <div class="panel"><table><tr><th>Code</th><th>Type</th><th>Value</th><th>Used</th><th>Status</th><th></th></tr>
  ${COUPONS.map((c, ix) => `<tr><td><b>${esc(c.code)}</b></td><td>${esc(c.type)}</td><td>${c.type === 'Percent' ? c.value + '%' : fmt(c.value)}</td><td>${c.used} times</td>
  <td>${pill(c.status)}</td><td><div class="rowb"><button class="btn sm ghost" onclick="toggleCoupon(${ix})">${c.status === 'Active' ? 'Pause' : 'Activate'}</button><button class="btn sm danger" onclick="delCoupon(${ix})">Delete</button></div></td></tr>`).join('')}</table></div>`;
}
function couponForm() {
  openBox(`<h3 style="margin-bottom:16px">Add Coupon</h3><form onsubmit="return saveCoupon(event)">
  <div class="field"><label>Code</label><input name="code" required placeholder="e.g. SAVE20"></div>
  <div class="frow"><div class="field"><label>Type</label><select name="type"><option>Percent</option><option>Flat</option></select></div>
  <div class="field"><label>Value</label><input name="value" type="number" min="1" required></div></div>
  <button class="btn" style="width:100%">Save Coupon</button></form>`);
}
function saveCoupon(ev) { ev.preventDefault(); const f = ev.target; COUPONS.unshift({ code: f.code.value.toUpperCase(), type: f.type.value, value: Number(f.value.value), used: 0, status: 'Active' }); store.set('coupons', COUPONS); closeBox(); go('coupons'); toast('Coupon created'); return false; }
function toggleCoupon(ix) { COUPONS[ix].status = COUPONS[ix].status === 'Active' ? 'Paused' : 'Active'; store.set('coupons', COUPONS); go('coupons'); }
function delCoupon(ix) { COUPONS.splice(ix, 1); store.set('coupons', COUPONS); go('coupons'); }
/* ---------- inventory ---------- */
function modInventory() {
  $('#content').innerHTML = `<div class="panel"><h3>Stock Levels</h3><table><tr><th>Product</th><th>Category</th><th>Stock</th><th>Status</th></tr>
  ${ITEMS.map(i => `<tr><td><b>${esc(i.name)}</b></td><td>${esc(i.cat)}</td>
  <td><input type="number" min="0" value="${i.stock}" style="width:110px" onchange="setStock(${i.id},this.value)"></td><td>${stockPill(i.stock)}</td></tr>`).join('')}</table>
  <p style="color:var(--mut);margin-top:10px;font-size:13px">Change a number and it saves instantly — the website updates too.</p></div>`;
}
function setStock(id, v) { const it = ITEMS.find(x => x.id === id); if (it) { it.stock = Number(v); saveItems(); go('inventory'); toast('Stock updated'); } }
/* ---------- payments ---------- */
function modPayments() {
  const txns = ORDERS.map(o => ({ id: 'txn_' + String(o.id).replace(/[^0-9]/g, '').slice(-6), name: o.name, amount: o.total, method: o.payment || 'Cash on Delivery', status: o.status === 'Cancelled' ? 'Failed' : (o.status === 'Pending' || o.status === 'New' ? 'Pending' : 'Succeeded'), date: o.date }));
  const vol = txns.filter(t => t.status === 'Succeeded').reduce((s, t) => s + t.amount, 0);
  $('#content').innerHTML = `<div class="cards">
  <div class="stat"><div class="l">Total Volume</div><div class="n">${fmt(vol)}</div><div class="d up">▲ successful payments</div></div>
  <div class="stat"><div class="l">Successful</div><div class="n">${txns.filter(t => t.status === 'Succeeded').length}</div><div class="d up">▲ completed</div></div>
  <div class="stat"><div class="l">Pending</div><div class="n">${txns.filter(t => t.status === 'Pending').length}</div><div class="d" style="color:var(--amb)">awaiting completion</div></div>
  <div class="stat"><div class="l">Failed</div><div class="n">${txns.filter(t => t.status === 'Failed').length}</div><div class="d down">▼ cancelled orders</div></div></div>
  <div class="panel"><h3>Transactions</h3><table><tr><th>Transaction ID</th><th>Customer</th><th>Method</th><th>Amount</th><th>Date</th><th>Status</th></tr>
  ${txns.map(t => `<tr><td><b>${t.id}</b></td><td>${esc(t.name)}</td><td>${esc(t.method)}</td><td><b>${fmt(t.amount)}</b></td><td>${dstr(t.date)}</td><td>${pill(t.status)}</td></tr>`).join('') || '<tr><td colspan="6">No transactions yet.</td></tr>'}</table></div>`;
}
/* ---------- reports ---------- */
function modReports() {
  const byCat = {}; ORDERS.filter(o => o.status !== 'Cancelled').forEach(o => (o.items || []).forEach(x => { const it = ITEMS.find(i => i.name === x.name); const c = it ? it.cat : 'Other'; byCat[c] = (byCat[c] || 0) + x.price * x.qty; }));
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]); const mx = Math.max.apply(null, entries.map(e => e[1]).concat([1]));
  const top = {}; ORDERS.forEach(o => (o.items || []).forEach(x => { top[x.name] = (top[x.name] || 0) + x.qty; }));
  const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  $('#content').innerHTML = `<div class="grid2">
  <div class="panel"><h3>Revenue by Category</h3>${entries.map(([c, v]) => `<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px"><span>${esc(c)}</span><b>${fmt(v)}</b></div><div style="background:#F0EDE4;border-radius:6px;height:12px"><div style="background:var(--c1);height:12px;border-radius:6px;width:${Math.round(v / mx * 100)}%"></div></div></div>`).join('') || '<p style="color:var(--mut)">No sales data yet.</p>'}</div>
  <div class="panel"><h3>Top Selling Items</h3><table><tr><th>Item</th><th>Units Sold</th></tr>${topList.map(([n, q]) => `<tr><td>${esc(n)}</td><td><b>${q}</b></td></tr>`).join('') || '<tr><td colspan="2">No sales yet.</td></tr>'}</table>
  <h3 style="margin-top:20px">Orders by Status</h3>${['New', 'Pending', 'Processing', 'Completed', 'Delivered', 'Cancelled'].map(s => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0EDE4"><span>${s}</span><b>${ORDERS.filter(o => o.status === s).length}</b></div>`).join('')}</div></div>`;
}
/* ---------- reviews ---------- */
function modReviews() {
  $('#content').innerHTML = `<div class="searchbar"><button class="btn" onclick="reviewForm()">+ Add Review</button></div>
  <div class="panel"><table><tr><th>Customer</th><th>Review</th><th>Item</th><th>Rating</th><th>Status</th><th></th></tr>
  ${REVIEWS.map((r, ix) => `<tr><td><b>${esc(r.name)}</b></td><td style="max-width:320px">${esc(r.text)}</td><td>${esc(r.item)}</td><td style="color:#E8930C">${'★'.repeat(r.stars)}</td>
  <td>${pill(r.status)}</td><td><div class="rowb"><button class="btn sm ghost" onclick="toggleReview(${ix})">${r.status === 'Published' ? 'Hide' : 'Publish'}</button><button class="btn sm danger" onclick="delReview(${ix})">Delete</button></div></td></tr>`).join('')}</table></div>`;
}
function reviewForm() {
  openBox(`<h3 style="margin-bottom:16px">Add Review</h3><form onsubmit="return saveReview(event)">
  <div class="frow"><div class="field"><label>Customer Name</label><input name="name" required></div>
  <div class="field"><label>Item</label><select name="item">${ITEMS.map(i => `<option>${esc(i.name)}</option>`).join('')}</select></div></div>
  <div class="field"><label>Rating</label><select name="stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
  <div class="field"><label>Review Text</label><textarea name="text" rows="3" required></textarea></div>
  <button class="btn" style="width:100%">Save Review</button></form>`);
}
function saveReview(ev) { ev.preventDefault(); const f = ev.target; REVIEWS.unshift({ name: f.name.value, text: f.text.value, item: f.item.value, stars: Number(f.stars.value), status: 'Published' }); store.set('reviews', REVIEWS); closeBox(); go('reviews'); toast('Review added'); return false; }
function toggleReview(ix) { REVIEWS[ix].status = REVIEWS[ix].status === 'Published' ? 'Draft' : 'Published'; store.set('reviews', REVIEWS); go('reviews'); }
function delReview(ix) { REVIEWS.splice(ix, 1); store.set('reviews', REVIEWS); go('reviews'); }

/* ---------- blog ---------- */
function modBlog() {
  $('#content').innerHTML = `<div class="searchbar"><button class="btn" onclick="postForm()">+ New Post</button></div>
  <div class="panel"><table><tr><th>Title</th><th>Author</th><th>Date</th><th>Status</th><th></th></tr>
  ${POSTS.map((p, ix) => `<tr><td><b>${esc(p.title)}</b></td><td>${esc(p.author)}</td><td>${dstr(p.date)}</td><td>${pill(p.status)}</td>
  <td><div class="rowb"><button class="btn sm ghost" onclick="postForm(${ix})">Edit</button><button class="btn sm danger" onclick="delPost(${ix})">Delete</button></div></td></tr>`).join('')}</table></div>`;
}
function postForm(ix) {
  const p = ix != null ? POSTS[ix] : { title: '', author: CFG.brand + ' Team', status: 'Draft', body: '' };
  openBox(`<h3 style="margin-bottom:16px">${ix != null ? 'Edit' : 'New'} Post</h3><form onsubmit="return savePost(event,${ix == null ? 'null' : ix})">
  <div class="field"><label>Title</label><input name="title" required value="${esc(p.title)}"></div>
  <div class="frow"><div class="field"><label>Author</label><input name="author" value="${esc(p.author)}"></div>
  <div class="field"><label>Status</label><select name="status"><option ${p.status === 'Published' ? 'selected' : ''}>Published</option><option ${p.status === 'Draft' ? 'selected' : ''}>Draft</option><option ${p.status === 'Archived' ? 'selected' : ''}>Archived</option></select></div></div>
  <div class="field"><label>Body</label><textarea name="body" rows="5">${esc(p.body)}</textarea></div>
  <button class="btn" style="width:100%">Save Post</button></form>`);
}
function savePost(ev, ix) { ev.preventDefault(); const f = ev.target; const d = { title: f.title.value, author: f.author.value, status: f.status.value, body: f.body.value, date: ix != null ? POSTS[ix].date : new Date().toISOString() }; if (ix != null) POSTS[ix] = d; else POSTS.unshift(d); store.set('posts', POSTS); closeBox(); go('blog'); toast('Post saved'); return false; }
function delPost(ix) { POSTS.splice(ix, 1); store.set('posts', POSTS); go('blog'); }
/* ---------- shipping ---------- */
function modShipping() {
  $('#content').innerHTML = `<div class="panel"><h3>Delivery Zones & Fees</h3><table><tr><th>Zone</th><th>Fee</th><th>Free Above</th><th>Delivery Time</th><th></th></tr>
  ${SHIPPING.map((z, ix) => `<tr><td><b>${esc(z.zone)}</b></td><td>${fmt(z.fee)}</td><td>${z.free > 0 ? fmt(z.free) : '—'}</td><td>${esc(z.days)}</td>
  <td><button class="btn sm ghost" onclick="shipForm(${ix})">Edit</button></td></tr>`).join('')}</table>
  <button class="btn" style="margin-top:14px" onclick="shipForm()">+ Add Zone</button></div>`;
}
function shipForm(ix) {
  const z = ix != null ? SHIPPING[ix] : { zone: '', fee: 0, free: 0, days: '1-2 days' };
  openBox(`<h3 style="margin-bottom:16px">${ix != null ? 'Edit' : 'Add'} Zone</h3><form onsubmit="return saveShip(event,${ix == null ? 'null' : ix})">
  <div class="field"><label>Zone Name</label><input name="zone" required value="${esc(z.zone)}"></div>
  <div class="frow"><div class="field"><label>Fee (${CFG.currency})</label><input name="fee" type="number" min="0" value="${z.fee}"></div>
  <div class="field"><label>Free Above (${CFG.currency}, 0 = never)</label><input name="free" type="number" min="0" value="${z.free}"></div></div>
  <div class="field"><label>Delivery Time</label><input name="days" value="${esc(z.days)}"></div>
  <button class="btn" style="width:100%">Save Zone</button></form>`);
}
function saveShip(ev, ix) { ev.preventDefault(); const f = ev.target; const d = { zone: f.zone.value, fee: Number(f.fee.value), free: Number(f.free.value), days: f.days.value }; if (ix != null) SHIPPING[ix] = d; else SHIPPING.push(d); store.set('shipping', SHIPPING); closeBox(); go('shipping'); toast('Zone saved'); return false; }
/* ---------- users ---------- */
function modUsers() {
  $('#content').innerHTML = `<div class="note">Team accounts for this demo panel are managed here. The panel login password is set in <b>data/site.js</b> (adminPass) — change it before real use.</div>
  <div class="searchbar"><button class="btn" onclick="userForm()">+ Add User</button></div>
  <div class="panel"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>
  ${USERS.map((u, ix) => `<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td><span class="pill b">${esc(u.role)}</span></td><td>${pill(u.status)}</td>
  <td><button class="btn sm danger" onclick="delUser(${ix})">Remove</button></td></tr>`).join('')}</table></div>`;
}
function userForm() {
  openBox(`<h3 style="margin-bottom:16px">Add Team User</h3><form onsubmit="return saveUser(event)">
  <div class="frow"><div class="field"><label>Name</label><input name="name" required></div>
  <div class="field"><label>Email</label><input name="email" type="email" required></div></div>
  <div class="field"><label>Role</label><select name="role"><option>Manager</option><option>Support</option><option>Admin</option></select></div>
  <button class="btn" style="width:100%">Add User</button></form>`);
}
function saveUser(ev) { ev.preventDefault(); const f = ev.target; USERS.unshift({ name: f.name.value, email: f.email.value, role: f.role.value, status: 'Active' }); store.set('users', USERS); closeBox(); go('users'); toast('User added'); return false; }
function delUser(ix) { USERS.splice(ix, 1); store.set('users', USERS); go('users'); }
/* ---------- settings ---------- */
function modSettings() {
  const s = CFG;
  $('#content').innerHTML = `<div class="panel" style="max-width:640px"><h3>Store Settings</h3>
  <form onsubmit="return saveSettings(event)">
  <div class="frow"><div class="field"><label>Business Name</label><input name="brand" value="${esc(s.brand)}"></div>
  <div class="field"><label>Tagline</label><input name="tagline" value="${esc(s.tagline)}"></div></div>
  <div class="frow"><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div>
  <div class="field"><label>WhatsApp Number (digits only)</label><input name="whatsapp" value="${esc(s.whatsapp)}"></div></div>
  <div class="frow"><div class="field"><label>Email</label><input name="email" value="${esc(s.email)}"></div>
  <div class="field"><label>Currency Code</label><input name="currency" value="${esc(s.currency)}"></div></div>
  <div class="field"><label>Address</label><textarea name="address" rows="2">${esc(s.address)}</textarea></div>
  <button class="btn">Save Settings</button></form>
  <p style="color:var(--mut);font-size:13px;margin-top:12px">Settings apply instantly on this website in this browser. For a permanent public change, use Backup → Export and send the file to your developer, or edit data/site.js.</p></div>`;
}
function saveSettings(ev) { ev.preventDefault(); const f = ev.target; const d = { brand: f.brand.value, tagline: f.tagline.value, phone: f.phone.value, whatsapp: f.whatsapp.value.replace(/[^0-9]/g, ''), email: f.email.value, currency: f.currency.value, address: f.address.value }; store.set('settings', d); CFG = Object.assign({}, SITE, d); toast('Settings saved — check the website'); go('settings'); return false; }
/* ---------- backup ---------- */
function modBackup() {
  $('#content').innerHTML = `<div class="panel" style="max-width:640px"><h3>Backup & Restore</h3>
  <p style="color:var(--mut);margin-bottom:16px">Export downloads everything this panel manages (products, orders, customers, settings…) as one JSON file. Import restores it on any browser.</p>
  <div class="rowb"><button class="btn" onclick="exportData()">Export Backup (JSON)</button>
  <label class="btn ghost" style="display:inline-block">Import Backup<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div>
  <hr style="border:none;border-top:1px solid var(--line);margin:22px 0">
  <h3 style="color:var(--red)">Reset Demo Data</h3>
  <p style="color:var(--mut);margin-bottom:12px">Removes all changes and restores the original template data in this browser.</p>
  <button class="btn danger" onclick="resetAll()">Reset Everything</button></div>`;
}
function exportData() {
  const keys = ['items', 'cats', 'orders', 'customers', 'coupons', 'reviews', 'posts', 'shipping', 'users', 'settings'];
  const out = {}; keys.forEach(k => { const v = store.get(k, null); if (v !== null) out[k] = v; });
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })); a.download = SLUG + '-backup.json'; a.click(); toast('Backup downloaded');
}
function importData(inp) {
  const file = inp.files[0]; if (!file) return;
  file.text().then(t => { try { const d = JSON.parse(t); Object.keys(d).forEach(k => store.set(k, d[k])); store.set('seeded', true); toast('Backup imported'); setTimeout(() => location.reload(), 700); } catch (e) { toast('Invalid backup file'); } });
}
function resetAll() { if (!confirm('Reset ALL panel data to the original template?')) return; ['items', 'cats', 'orders', 'customers', 'coupons', 'reviews', 'posts', 'shipping', 'users', 'settings', 'seeded', 'cart'].forEach(k => store.del(k)); location.reload(); }
/* ---------- shell ---------- */
function openBox(html) { $('#modalBox').innerHTML = '<button class="x" onclick="closeBox()">✕</button>' + html; $('#modal').classList.add('on'); }
function closeBox() { $('#modal').classList.remove('on'); }
function doLogin(ev) { ev.preventDefault(); if ($('#pw').value === SITE.adminPass) { sessionStorage.setItem(SLUG + '_admin_ok', '1'); boot(); } else { $('#loginErr').textContent = 'Wrong password — try again.'; } return false; }
function logout() { sessionStorage.removeItem(SLUG + '_admin_ok'); location.reload(); }
function boot() {
  seedAll();
  $('#login').style.display = 'none'; $('#app').style.display = 'block';
  $('#sideBrand').textContent = CFG.brand; $('#sideMark').textContent = CFG.brand.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  $('#nav').innerHTML = NAV.map(n => `<button data-mod="${n[0]}" onclick="go('${n[0]}')">${n[2]}<span>${n[1]}</span></button>`).join('');
  go('dashboard');
}
document.addEventListener('DOMContentLoaded', () => { if (sessionStorage.getItem(SLUG + '_admin_ok') === '1') boot(); });
</script>
</body></html>
